<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juyel Spikier</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"></script>

<style>
body{
background:#050505;
color:white;
font-family:Arial;
margin:0;
padding:0;
}

header{
background:#111;
padding:20px;
text-align:center;
font-size:30px;
color:#00bfff;
font-weight:bold;
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.box{
background:#111;
padding:20px;
border-radius:15px;
margin-top:20px;
border:1px solid #00bfff;
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
background:#222;
color:white;
border:none;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00bfff;
color:white;
border:none;
border-radius:10px;
font-size:16px;
}

.order{
background:#1a1a1a;
padding:10px;
margin-top:10px;
border-radius:10px;
}
</style>
</head>
<body>

<header>JUYEL SPIKIER</header>

<div class="container">

<div class="box">
<h2>Login With Gmail</h2>
<button onclick="login()">Login With Google</button>
<p id="user"></p>
</div>

<div class="box">
<h2>Order Product</h2>

<select id="product">
<option>500 Friend ID - 50 TK</option>
<option>1000 Friend ID - 100 TK</option>
<option>Gaming Account - 200 TK</option>
</select>

<select id="payment">
<option>bKash</option>
<option>Nagad</option>
<option>Rocket</option>
</select>

<input type="text" id="trx" placeholder="Enter Transaction ID">

<button onclick="submitOrder()">Submit Order</button>
</div>

<div class="box">
<h2>Admin Orders</h2>
<div id="orders"></div>
</div>

</div>

<script>

const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_MESSAGING_ID",
appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

function login(){
const provider = new firebase.auth.GoogleAuthProvider();

auth.signInWithPopup(provider)
.then((result)=>{
currentUser = result.user;
document.getElementById('user').innerHTML = "Logged in: " + currentUser.email;

saveLogin(currentUser.email);
loadOrders();
});
}

function saveLogin(email){
db.collection('logins').add({
email: email,
time: new Date()
});
}

function submitOrder(){
if(!currentUser){
alert('Login First');
return;
}

const product = document.getElementById('product').value;
const payment = document.getElementById('payment').value;
const trx = document.getElementById('trx').value;

if(trx === ''){
alert('Enter Transaction ID');
return;
}

 db.collection('orders').add({
email: currentUser.email,
product: product,
payment: payment,
trx: trx,
time: new Date()
}).then(()=>{
alert('Order Submitted');
loadOrders();
});
}

function loadOrders(){
const ordersDiv = document.getElementById('orders');
ordersDiv.innerHTML = '';

 db.collection('orders').get().then((querySnapshot)=>{
querySnapshot.forEach((doc)=>{
const data = doc.data();

ordersDiv.innerHTML += `
<div class="order">
<p><b>Email:</b> ${data.email}</p>
<p><b>Product:</b> ${data.product}</p>
<p><b>Payment:</b> ${data.payment}</p>
<p><b>TRX ID:</b> ${data.trx}</p>
</div>
`;
});
});
}

</script>

</body>
</html>
